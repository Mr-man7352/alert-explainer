# Day 1: PostgreSQL only. The API and dashboard services are added on Days 11 and 13.
# Ollama runs on the host (it needs the Mac GPU), not in a container.
services:
  db:
    image: postgres:16-alpine
    container_name: alert-explainer-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
