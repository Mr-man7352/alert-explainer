[project]
name = "alert-explainer"
version = "0.1.0"
description = "ML intrusion detection on CIC-IDS2017 with grounded, privacy-preserving LLM explanations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Manish Sahu" }]
license = { text = "MIT" }
# Dependencies are added day by day as each component is built (see docs/devlog.md).
dependencies = [
    "polars>=1.20",
    "pyarrow>=18",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "joblib>=1.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "scipy>=1.13",
    "torch>=2.5",
    # Day 6: synthetic inventory, Integrated Gradients for the MLP
    "faker>=30",
    "captum>=0.8",
    # Day 7: local embeddings for the ATT&CK fallback retrieval
    "sentence-transformers>=3.3",
]

[project.scripts]
ae = "alert_explainer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "shap>=0.46",  # test-only: checks LightGBM's built-in TreeSHAP against shap.TreeExplainer
]

# Linux (CI, Docker) gets the CPU-only PyTorch wheel: the default PyPI wheel pulls ~3 GB of CUDA
# libraries. macOS uses the normal PyPI wheel, which includes Apple's MPS backend.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alert_explainer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "RUF"]
ignore = [
    "E501",  # line length is enforced by `ruff format`; long text strings are fine
    "RUF001", "RUF002", "RUF003",  # en dashes in docstrings/labels are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"src/alert_explainer/data/synthetic.py" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: trains a model; deselect with -m 'not slow'"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/alert_explainer"]
